[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kratos-smolvla"
version = "0.1.0"
description = "Reproducible SmolVLA robotics fine-tuning workload for Kratos"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.scripts]
kratos-smolvla = "kratos_smolvla.train:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kratos_smolvla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
