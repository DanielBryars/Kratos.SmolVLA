name: Publish workload image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reclaim runner disk for the pinned model and dataset
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/danielbryars/kratos-smolvla:edge
            ghcr.io/danielbryars/kratos-smolvla:sha-${{ github.sha }}
          cache-from: type=gha,scope=smolvla
          cache-to: type=gha,mode=max,scope=smolvla
          provenance: mode=max
          sbom: true
      - name: Record immutable workload reference
        run: echo "ghcr.io/danielbryars/kratos-smolvla@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
